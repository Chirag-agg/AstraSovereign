# Top-level precedence order for deterministic conflict resolution.
# If a recognized text matches multiple patterns (e.g. TK-200 could match equipment_tag
# or instrument_tag, or 6"-P-1203-A1A could contain P-1203), the earlier pattern in this
# list wins.
precedence:
  - line_number
  - equipment_tag
  - instrument_tag
  - revision

# Tag regex patterns and domain metadata only (no numeric tuning thresholds).
patterns:
  line_number:
    description: "Process piping line designation (size, service, sequence, piping class)"
    regex: '\b(\d{1,2}(?:\.\d+)?)[ "''"]?-([A-Z0-9]+)-([0-9]{3,5})(?:-([A-Z0-9]+))?\b'
    examples:
      - '6"-P-1203-A1A'
      - '2-W-101-CS'
      - '3"-HC-1001-B11'
    groups:
      size: 1
      service: 2
      sequence: 3
      piping_class: 4

  equipment_tag:
    description: "Major process equipment tag (Tanks, Pumps, Exchangers, Vessels, etc.)"
    regex: '\b(TANK|TK|HX|[A-Z])-([0-9]{2,4}[A-Z]?)\b'
    examples:
      - "TANK-204"
      - "TK-200"
      - "P-101A"
      - "E-102"
      - "V-301"
    groups:
      equipment_type: 1
      sequence: 2

  instrument_tag:
    description: "ISA-5.1 compliant instrument loop tag (measured variable + function + loop number)"
    regex: '\b([A-Z]{2,4})-?([0-9]{2,4}[A-Z]?)\b'
    examples:
      - "PT-204A"
      - "FT-101"
      - "TT-302"
      - "LT-204"
      - "PSV-501"
    groups:
      function: 1
      loop_number: 2

  revision:
    description: "Engineering drawing revision designation"
    regex: '\b(?:REV|REVISION)[\s.:#-]*([A-Z0-9]{1,3})\b'
    examples:
      - "REV 0"
      - "REV B"
      - "REVISION 3"
      - "REV. A"
      - "REV: 2"
    groups:
      revision_id: 1
