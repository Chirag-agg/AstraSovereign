# Local model registry for the Sovereign AI Workbench.
#
# Maps each task type to the local model that handles it. Model names must refer
# to models already pulled into the local Ollama server (`ollama pull <model>`);
# the backend never downloads models.
#
# `fallback_to` declares an explicit, bounded substitution chain (max 2 hops).
# Every fallback target must satisfy the entry's declared capabilities and
# support tool calling, otherwise the backend refuses to start. Fallback is
# enabled by default (MODEL_FALLBACK_ENABLED) but can be disabled for benchmarks.
#
# `model_capabilities` declares what each model can do so chains can be
# validated at load; entries that are another task's primary model inherit that
# entry's capabilities unless overridden here.

models:
  general:
    provider: ollama
    model: llama3.1:latest
    enabled: true
    capabilities:
      - general
      - reasoning
      - summarization
    fallback_to: []
    resources:
      gpu_vram_mb: 4096
      cpu_cores: 2
      memory_mb: 4096

  coding:
    provider: ollama
    model: llama3.1:latest
    enabled: true
    capabilities:
      - coding
      - debugging
      - code_review
    fallback_to:
      - qwen2.5-coder:7b
    resources:
      gpu_vram_mb: 4096
      cpu_cores: 2
      memory_mb: 4096

  # Optional math specialist. Disabled by default; while disabled, pipeline math
  # stages fall back to the `general` model instead of failing.
  math:
    provider: ollama
    model: qwen2.5-math:1.5b
    enabled: false
    capabilities:
      - math
      - reasoning
    fallback_to: []
    resources:
      gpu_vram_mb: 2048
      cpu_cores: 2
      memory_mb: 2048

  document:
    provider: ollama
    model: llama3.1:latest
    enabled: true
    capabilities:
      - document
      - summarization
    fallback_to: []
    resources:
      gpu_vram_mb: 4096
      cpu_cores: 2
      memory_mb: 4096

  # Vision has no valid smaller peer: an empty chain means it fails cleanly if
  # the model is missing rather than producing confident nonsense from a
  # text-only model.
  vision:
    provider: ollama
    model: llava:7b
    enabled: true
    capabilities:
      - vision
      - image
    fallback_to: []
    resources:
      gpu_vram_mb: 4096
      cpu_cores: 2
      memory_mb: 4096

model_capabilities:
  qwen2.5-coder:3b:
    capabilities:
      - general
      - reasoning
      - summarization
      - coding
      - debugging
      - code_review
    tools: false
  qwen2.5-coder:7b:
    capabilities:
      - coding
      - debugging
      - code_review
    tools: true
  llama3.1:latest:
    capabilities:
      - general
      - reasoning
      - summarization
      - document
    tools: true
  llava:7b:
    capabilities:
      - vision
      - image
    tools: false
  qwen2.5-math:1.5b:
    capabilities:
      - math
      - reasoning
    tools: true
